name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: osm-buildings
      - name: Install project with optional extras
        shell: bash -l {0}
        run: python -m pip install -e ".[gui,gpkg,dev]"
      - name: Lint with Ruff
        shell: bash -l {0}
        run: python -m ruff check .
      - name: Type check with mypy
        shell: bash -l {0}
        run: python -m mypy download_buildings.py gui.py tiffgetter_adapter.py
      - name: Run test suite
        shell: bash -l {0}
        run: python -m unittest -v
      - name: Build Windows executables
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          python -m PyInstaller packaging/osm_buildings_cli.spec --noconfirm --distpath build/exe --workpath build/pyinstaller
          python -m PyInstaller packaging/osm_buildings_gui.spec --noconfirm --distpath build/exe --workpath build/pyinstaller
      - name: Upload Windows executables
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: osm-building-downloader-windows
          path: build/exe/*.exe
