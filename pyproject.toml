[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-building-downloader"
version = "2.1.0"
description = "从 Overpass API 下载 OSM 建筑轮廓并导出为 GeoJSON、Shapefile 或 GeoPackage 的命令行与桌面工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.4",
    "pyshp>=2.3,<3",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
gpkg = ["fiona>=1.9"]
dev = ["ruff>=0.6", "mypy>=1.10", "pyinstaller>=6.6"]

[project.scripts]
osm-buildings = "download_buildings:main"
osm-buildings-gui = "gui:main"

[tool.setuptools]
py-modules = ["download_buildings", "gui"]

[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = false
